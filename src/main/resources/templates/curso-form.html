<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo curso | SpringEduManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="barra">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a class="marca" th:href="@{/estudiantes}">SpringEduManager</a>
        <div class="d-flex align-items-center gap-4">
            <a class="enlace" th:href="@{/estudiantes}">Estudiantes</a>
            <a class="enlace activo" th:href="@{/cursos}">Cursos</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="sello sello-tenue sello-chico">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <header class="encabezado">
        <h1>Nuevo curso</h1>
        <p class="sub">Define el curso, su horario y cuántos estudiantes caben.</p>
    </header>

    <div class="row">
        <div class="col-lg-7">
            <div class="panel">
                <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="nombreCurso">Nombre del curso</label>
                        <input type="text" class="form-control entrada" th:field="*{nombreCurso}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea rows="3" class="form-control entrada" th:field="*{descripcion}"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="horario">Horario</label>
                        <input type="text" class="form-control entrada" th:field="*{horario}"
                               placeholder="Lunes y miércoles, 18:00 a 20:00" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="cupos">Cupos</label>
                        <input type="number" min="0" class="form-control entrada" th:field="*{cupos}" required>
                    </div>
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <button type="submit" class="sello">Guardar curso</button>
                        <a class="sello sello-tenue" th:href="@{/cursos}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
