<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cursos | SpringEduManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="barra">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a class="marca" th:href="@{/estudiantes}">SpringEduManager</a>
        <div class="d-flex align-items-center gap-4">
            <a class="enlace" th:href="@{/estudiantes}">Estudiantes</a>
            <a class="enlace activo" th:href="@{/cursos}">Cursos</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="sello sello-tenue sello-chico">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <header class="encabezado">
        <div class="discos discos-esquina" aria-hidden="true"></div>
        <div class="texto">
            <h1>Cursos</h1>
            <p class="sub">Los cursos disponibles, con su horario y sus cupos.</p>
        </div>
    </header>

    <div class="mb-4">
        <a class="sello" th:href="@{/cursos/nuevo}">Agregar curso</a>
    </div>

    <div class="table-responsive">
        <table class="tabla-edu">
            <thead>
                <tr>
                    <th class="num">ID</th>
                    <th>Curso</th>
                    <th>Descripción</th>
                    <th>Horario</th>
                    <th class="num">Cupos</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="curso : ${cursos}">
                    <td class="num" th:text="${curso.id}"></td>
                    <td th:text="${curso.nombreCurso}"></td>
                    <td th:text="${curso.descripcion}"></td>
                    <td th:text="${curso.horario}"></td>
                    <td class="num" th:text="${curso.cupos}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(cursos)}">
                    <td class="vacio" colspan="5">Aún no hay cursos registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
