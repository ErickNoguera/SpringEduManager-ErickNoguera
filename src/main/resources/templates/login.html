<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | SpringEduManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center py-5">
    <div class="row w-100 align-items-center g-5">

        <section class="col-lg-6">
            <div class="discos" aria-hidden="true"></div>
            <h1 style="font-size: clamp(2.6rem, 7vw, 4.5rem); letter-spacing: -0.03em;">SpringEduManager</h1>
            <p class="sub">Los estudiantes y los cursos del bootcamp, en un solo lugar.</p>
        </section>

        <section class="col-lg-5 offset-lg-1">
            <div class="panel">
                <h2 class="h3 mb-4">Inicia sesión</h2>

                <div class="aviso aviso-error" role="alert" th:if="${param.error}">
                    Usuario o contraseña incorrectos. Revisa los datos e intenta de nuevo.
                </div>
                <div class="aviso" th:if="${param.logout}">
                    Cerraste sesión.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Usuario</label>
                        <input class="form-control entrada" type="text" id="username" name="username"
                               autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Contraseña</label>
                        <input class="form-control entrada" type="password" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="sello">Entrar</button>
                </form>
            </div>
        </section>
    </div>
</main>
</body>
</html>
